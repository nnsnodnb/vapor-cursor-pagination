name: Test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      matrix:
        os: ["ubuntu-24.04", "macos-26", "macos-15"]
        swift: ["6.3", "6.2", "6.1", "6.0", "5.3"]
    name: Test for Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: ${{ matrix.swift }}
    - name: Install xcbeautify
      if: startsWith(matrix.os, "ubuntu-")
      run: brew install xcbeautify
    - name: Run tests
      run: swift test 2>&1 | xcbeautify
